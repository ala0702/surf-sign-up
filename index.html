<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Surf Club</title>
</head>
<body>
    <!-- two main parts: photo and form -->
     <div class="side-image">
        <img src="images/surf-side-photo.jpg" alt="">
     </div>
     <div class="main-content">
        <div class="intro-warning-form-text">it is not real surf camp web.</div>
        <div class="sign-in-section">
            <div class="intro-form-text">do you want to catch a wave?.</div>
            <form>
                <div class="welcome-to-form-text">Hola mojo!</div>

                <label for="name"></label>
                <input type="text" placeholder="bob" id="name" name="name" required>
                <label for="surname"></label>
                <input type="text" placeholder="kowalski" id="surname" name="surname" required>
                <label for="email"></label>
                <input type="email" placeholder="" id="email" name="'email" required>
                <label for="telephone-number"></label>
                <input type="tel" placeholder="" id="telephone-number" required>
                <label for="password-one"></label>
                <input type="password" placeholder="" id="password-one" required>
                <label for="password-two"></label>
                <input type="password-check" placeholder="" id="password-two" required>
                <!-- submit -->
                <button>Create account</button>
            </form>
        </div>
        <div class="log-in-section">
            <div>already have an account?</div>
            <button>
                Log in
            </button>
        </div>
     </div>
</body>
</html>
